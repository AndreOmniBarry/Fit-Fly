name: Android debug APK

# Builds an installable debug APK so BLE, pedometer, and background-geo can be
# tested on a real phone -- there's no Android SDK/hardware in a Claude Code
# cloud sandbox, so this is the only way to get a testable build out of CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: fit-fly-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
