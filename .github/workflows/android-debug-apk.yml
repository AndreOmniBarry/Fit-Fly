name: Android debug APK

# Builds an installable debug APK so BLE, pedometer, and background-geo can be
# tested on a real phone -- there's no Android SDK/hardware in a Claude Code
# cloud sandbox, so this is the only way to get a testable build out of CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # The action's own default package list includes the legacy
          # "tools" package, which Google removed from the SDK repository
          # years ago -- installing it unconditionally makes sdkmanager
          # exit non-zero before the build ever starts. platform-tools is
          # all this step needs; AGP auto-downloads the compileSdk 36
          # platform/build-tools itself during the Gradle build, now that
          # licenses are accepted and ANDROID_HOME is set.
          packages: 'platform-tools'

      - name: Install JS dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: fit-fly-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
